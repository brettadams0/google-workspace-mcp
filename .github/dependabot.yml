# Monthly and grouped, so keeping dependencies current costs one pull request a
# month rather than one per package. Security updates are not on this schedule:
# GitHub raises those as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Zod majors are ignored, and that has a known cost. Zod 3 is affected by
      # GHSA-mrhx-c7xc-m3w5 (HIGH): an array schema with no length cap can be made
      # to exhaust memory. The only fix is Zod 4.6.6; there is no Zod 3 backport.
      # Mitigation: every array a tool here accepts has a length cap, and a test
      # fails CI on any array in mcp-surface.json without one.
      # The real fix is the Zod 4 migration, deferred because Zod 4 changes every
      # tool schema and does not yet fit the 16 KB definition budget: #19.
      - dependency-name: zod
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
