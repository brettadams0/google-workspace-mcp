name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The suite registers every tool, exercises the MIME builder, and checks
      # the requests sent to Google through a recording auth client. It never
      # touches the network and never reads credentials/, so it is safe to run
      # on a runner that has no Google OAuth client at all.
      #
      # `npm test` names test/tools.test.js explicitly rather than passing a
      # directory or glob: directory arguments to `node --test` fail on Linux,
      # and Node 20 does not expand globs itself. Bare `node --test` would also
      # discover scripts/smoke-test.js, which does hit the live Google APIs.
      - run: npm test

      # Starts the real server over stdio, as an MCP client would, and compares
      # every tool name, description, schema and annotation against the
      # committed mcp-surface.json. A surface change has to arrive as a diff to
      # that file in the same pull request, or this step fails. Listing tools
      # needs no credentials: auth is only reached when a tool is called.
      - name: Check the tool surface against mcp-surface.json
        run: npm run surface

      # credentials/ is gitignored, but a mistake there would leak a live OAuth
      # client secret and refresh token, so fail the build rather than trust it.
      - name: Assert no credentials are tracked
        run: |
          if git ls-files --error-unmatch credentials/client_secret.json credentials/token.json 2>/dev/null; then
            echo "::error::A real credential file is tracked by git."
            exit 1
          fi
          echo "OK: only credentials/client_secret.example.json is tracked."
          git ls-files credentials/
